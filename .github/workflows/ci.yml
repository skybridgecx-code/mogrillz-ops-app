name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_USE_MOCK_DATA: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run public quality gate
        run: npm run check

  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mogrillz_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mogrillz_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-client

      - name: Apply schema and run database contracts
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: mogrillz_contract
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql --set ON_ERROR_STOP=1 --file tests/sql/order-lifecycle-acl-contract.sql
          psql --set ON_ERROR_STOP=1 --file tests/sql/backup-table-security-contract.sql
          psql --set ON_ERROR_STOP=1 --file tests/sql/trigger-function-search-path-contract.sql
