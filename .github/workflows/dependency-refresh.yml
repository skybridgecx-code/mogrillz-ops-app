name: Dependency Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/ops-hardening-phase-0-1a'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_USE_MOCK_DATA: "true"

    steps:
      - name: Check out frozen hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-hardening-phase-0-1a

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve reviewed dependency versions
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify complete dependency audit
        run: npm audit --audit-level=high

      - name: Validate refreshed graph
        run: |
          npm ci
          npm run check

      - name: Commit refreshed manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency manifests already resolved."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh dependency lock"
          git push origin HEAD:agent/ops-hardening-phase-0-1a
